<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 버스 도착 정보 조회</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { margin-bottom: 20px; color: #333; text-align: center; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .result-card { background: #f8f9fa; border-left: 5px solid #007bff; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
        .bus-name { font-weight: bold; font-size: 18px; color: #007bff; }
        .bus-time { margin-top: 5px; color: #555; }
        .loading { text-align: center; color: #888; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>버스 도착 정보 조회</h2>
    <div class="input-group">
        <input type="text" id="arsIdInput" placeholder="정류소 고유번호 (예: 01001)" />
        <button onclick="searchBus()">조회</button>
    </div>
    
    <div id="loading" class="loading">조회 중입니다...</div>
    <div id="resultContainer"></div>
</div>

<script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxTDsUvrUb4G6r6DIR3P1XI-mt5pwbiZaFRXci94kKGmwQSiZzLb_sA9CFP0P2v9_o/exec'; // 배포된 GAS 웹앱 URL 입력

    async function searchBus() {
        const arsId = document.getElementById('arsIdInput').value.trim();
        const resultContainer = document.getElementById('resultContainer');
        const loading = document.getElementById('loading');
        
        if (!arsId) {
            alert('정류소 고유번호를 입력해주세요.');
            return;
        }

        resultContainer.innerHTML = '';
        loading.style.display = 'block';

        try {
            const response = await fetch(`${GAS_WEB_APP_URL}?arsId=${arsId}`);
            const result = await response.json();
            
            loading.style.display = 'none';

            if (result.status === 'success' && result.data.length > 0) {
                let html = '';
                result.data.forEach(bus => {
                    html += `
                        <div class="result-card">
                            <div class="bus-name">${bus.routeName}번 버스</div>
                            <div class="bus-time">도착예정: ${bus.predictTime1}</div>
                            <div class="bus-time" style="font-size: 13px; color: #888;">차순위: ${bus.predictTime2}</div>
                        </div>
                    `;
                });
                resultContainer.innerHTML = html;
            } else {
                resultContainer.innerHTML = '<p style="text-align: center; color: #777;">운행 중인 버스 정보가 없습니다.</p>';
            }
        } catch (error) {
            loading.style.display = 'none';
            resultContainer.innerHTML = '<p style="text-align: center; color: red;">데이터를 불러오는 데 실패했습니다.</p>';
            console.error(error);
        }
    }
</script>

</body>
</html>
