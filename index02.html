<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 방명록</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007BFF; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .guestbook-item { border-bottom: 1px solid #ddd; padding: 10px 0; margin-bottom: 10px; }
        .guestbook-item .meta { font-size: 0.85em; color: #666; }
    </style>
</head>
<body>

    <h1>방명록</h1>

    <!-- 작성 폼 -->
    <form id="guestbookForm">
        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" required placeholder="이름을 입력하세요">
        </div>
        <div class="form-group">
            <label for="message">내용</label>
            <textarea id="message" rows="3" required placeholder="남기고 싶은 말을 적어주세요"></textarea>
        </div>
        <button type="submit">등록하기</button>
    </form>

    <hr style="margin: 30px 0;">

    <!-- 방명록 목록 -->
    <div id="guestbookList">방명록을 불러오는 중...</div>

    <script>
        // 3단계에서 복사한 웹 앱 URL을 여기에 붙여넣으세요.
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw058Uv2UwsimABA14ib6G9OnCPL5gaNGzDH8JW2Kr2wDVJigrG_W5kMCFOjkLsfu63/exec";

        // 방명록 목록 불러오기 (GET)
        async function fetchGuestbook() {
            const listDiv = document.getElementById('guestbookList');
            try {
                const response = await fetch(WEB_APP_URL);
                const result = await response.json();

                if (result.status === "success") {
                    if (result.data.length === 0) {
                        listDiv.innerHTML = "<p>작성된 방명록이 없습니다. 첫 글을 남겨주세요!</p>";
                        return;
                    }

                    let html = "";
                    result.data.forEach(item => {
                        html += `
                            <div class="guestbook-item">
                                <strong>${escapeHtml(item.name)}</strong>
                                <div class="meta">${item.timestamp}</div>
                                <p>${escapeHtml(item.message)}</p>
                            </div>
                        `;
                    });
                    listDiv.innerHTML = html;
                } else {
                    listDiv.innerHTML = "<p>방명록을 불러오지 못했습니다.</p>";
                }
            } catch (error) {
                console.error(error);
                listDiv.innerHTML = "<p>데이터를 불러오는 중 오류가 발생했습니다.</p>";
            }
        }

        // 방명록 작성 제출 (POST)
        document.getElementById('guestbookForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const message = document.getElementById('message').value;
            const submitBtn = e.target.querySelector('button');

            submitBtn.disabled = true;
            submitBtn.innerText = "등록 중...";

            try {
                // GAS 웹앱에 데이터를 보낼 때 CORS 이슈를 피하기 위해 text/plain 타입으로 우회 전송 가능
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ name, message })
                });

                const result = await response.json();
                if (result.status === "success") {
                    document.getElementById('name').value = '';
                    document.getElementById('message').value = '';
                    fetchGuestbook(); // 목록 새로고침
                } else {
                    alert("등록 실패: " + result.message);
                }
            } catch (error) {
                console.error(error);
                // 브라우저 정책상 응답 본문을 읽지 못하고 오류가 날 때가 있으나, 실제 시에는 데이터가 잘 들어간 경우도 있음
                alert("등록 요청이 전송되었습니다.");
                fetchGuestbook();
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "등록하기";
            }
        });

        // XSS 방지 간단 함수
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 페이지 로드 시 방명록 조회
        fetchGuestbook();
    </script>
</body>
</html>
